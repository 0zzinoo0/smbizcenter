<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>중소기업비지니스센터 관리자</title>
<style>
:root{--navy:#0b2e59;--blue:#174f8a;--gold:#c89b3c;--bg:#f3f6fa;--line:#dbe3ec;--text:#162333;--muted:#6d7784;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#081f3b,#174f8a)}.login-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 70px #0004}.brand{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:6px}.sub{color:var(--muted);font-size:14px;margin-bottom:24px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.btn-primary{background:var(--navy);color:#fff}.btn-secondary{background:#eaf0f7;color:var(--navy)}.btn-danger{background:#fff0ee;color:var(--danger)}.login .btn{width:100%}.error{color:var(--danger);font-size:13px;margin-top:10px}.app{min-height:100vh}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.topbar h1{font-size:19px;margin:0}.top-actions{display:flex;gap:10px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}.sidebar{background:#0b2545;padding:22px 14px;color:#fff}.sidebar button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dce7f5;padding:12px 14px;border-radius:9px;margin-bottom:4px;cursor:pointer}.sidebar button.active,.sidebar button:hover{background:#174f8a;color:#fff}.main{padding:28px;max-width:1150px}.panel{display:none}.panel.active{display:block}.panel h2{margin:0 0 6px}.panel>p{margin:0 0 22px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:#fbfcfe}.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.item-head strong{font-size:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.status{position:fixed;right:24px;bottom:24px;background:#102a49;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px #0003}.image-row{display:grid;grid-template-columns:1fr auto;gap:8px}.preview{width:100%;max-width:220px;height:120px;object-fit:cover;border:1px solid var(--line);border-radius:9px;margin-top:8px;background:#eef2f6}.small{font-size:12px;color:var(--muted)}@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding:10px}.sidebar button{white-space:nowrap;width:auto;margin:0 4px}.main{padding:18px}.grid2,.grid3{grid-template-columns:1fr}.topbar{padding:0 16px}.top-actions .btn-secondary{display:none}}
</style>
</head>
<body>
<section id="login" class="login"><div class="login-card"><div class="brand">중소기업비지니스센터</div><div class="sub">홈페이지 관리자 로그인</div><div class="field"><label>아이디</label><input id="username" autocomplete="username"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn btn-primary">로그인</button><div id="loginError" class="error"></div><p class="small">아이디와 비밀번호는 Netlify 환경변수에서 설정합니다.</p></div></section>
<section id="app" class="app hidden"><header class="topbar"><h1>홈페이지 관리자</h1><div class="top-actions"><a class="btn btn-secondary" href="/" target="_blank" style="text-decoration:none">홈페이지 보기</a><button id="saveBtn" class="btn btn-primary">전체 저장</button><button id="logoutBtn" class="btn btn-secondary">로그아웃</button></div></header><div class="layout"><aside class="sidebar"><button class="nav active" data-panel="company">회사 정보</button><button class="nav" data-panel="home">메인페이지</button><button class="nav" data-panel="about">회사소개</button><button class="nav" data-panel="cases">상담사례</button><button class="nav" data-panel="team">전문가</button><button class="nav" data-panel="faq">FAQ</button></aside><main class="main">
<section id="company" class="panel active"><h2>회사 정보</h2><p>브랜드, 운영법인, 연락처와 주소를 관리합니다.</p><div id="companyFields" class="card grid2"></div></section>
<section id="home" class="panel"><h2>메인페이지</h2><p>첫 화면의 핵심 문구를 수정합니다.</p><div id="homeFields" class="card"></div></section>
<section id="about" class="panel"><h2>회사소개</h2><p>미션과 대표 소개를 수정합니다.</p><div id="aboutFields" class="card"></div></section>
<section id="cases" class="panel"><div class="toolbar"><div><h2>상담사례</h2><p>가상·재구성 여부를 명확히 표시해 운영하세요.</p></div><button class="btn btn-secondary" onclick="addCase()">사례 추가</button></div><div id="casesList"></div></section>
<section id="team" class="panel"><div class="toolbar"><div><h2>전문가 소개</h2><p>구성원 정보와 공개 여부를 관리합니다.</p></div><button class="btn btn-secondary" onclick="addTeam()">전문가 추가</button></div><div id="teamList"></div></section>
<section id="faq" class="panel"><div class="toolbar"><div><h2>자주 묻는 질문</h2><p>질문과 답변을 추가·수정합니다.</p></div><button class="btn btn-secondary" onclick="addFaq()">FAQ 추가</button></div><div id="faqList"></div></section>
</main></div></section><div id="status" class="status hidden"></div>
<script>
let token=sessionStorage.getItem('smbiz_admin_token')||'';let data=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const labels={brand_name:'브랜드명',operator_name:'운영법인',operator_representative:'운영법인 대표',brand_representative:'브랜드 대표',business_number:'사업자등록번호',registration_number:'상담회사 등록번호',address:'주소',phone:'대표 전화',email:'상담 이메일',kakao_url:'카카오 상담 URL',hero_title:'메인 제목',hero_description:'메인 설명',hero_primary_button:'메인 버튼 문구',about_title:'회사소개 제목',about_description:'회사소개 설명',mission_title:'미션 제목',mission_text:'미션 설명',representative_bio:'대표 소개'};
function showStatus(msg,bad=false){const el=$('#status');el.textContent=msg;el.style.background=bad?'#9f1d17':'#102a49';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
function field(obj,key,multi=false){return `<div class="field"><label>${labels[key]||key}</label>${multi?`<textarea data-object="${obj}" data-key="${key}">${esc(data[obj]?.[key])}</textarea>`:`<input data-object="${obj}" data-key="${key}" value="${esc(data[obj]?.[key])}">`}</div>`}
async function login(){const r=await fetch('/.netlify/functions/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});const j=await r.json();if(!r.ok){$('#loginError').textContent=j.error||'로그인 실패';return}token=j.token;sessionStorage.setItem('smbiz_admin_token',token);await boot()}
async function loadData(){let r=await fetch('/.netlify/functions/content-get?v='+Date.now());if(!r.ok)r=await fetch('/content/site.json?v='+Date.now());data=await r.json()}
async function boot(){try{await loadData();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('smbiz_admin_token');token='';$('#loginError').textContent='콘텐츠를 불러오지 못했습니다.'}}
function render(){ $('#companyFields').innerHTML=Object.keys(data.company).map(k=>field('company',k,k==='address')).join('');$('#homeFields').innerHTML=Object.keys(data.home).map(k=>field('home',k,true)).join('');$('#aboutFields').innerHTML=Object.keys(data.about).map(k=>field('about',k,true)).join('');renderCases();renderTeam();renderFaq() }
function renderCases(){ $('#casesList').innerHTML=data.cases.map((c,i)=>`<div class="item"><div class="item-head"><strong>사례 ${i+1}</strong><button class="btn btn-danger" onclick="removeCase(${i})">삭제</button></div><div class="grid2">${caseField(i,'label','표시 라벨')}${caseField(i,'title','제목')}${caseField(i,'category','기업 분류')}${caseField(i,'image','이미지 경로',false,true)}</div>${caseField(i,'situation','기업 상황',true)}${caseField(i,'review','검토 내용',true)}${caseField(i,'proposal','제안 방향',true)}</div>`).join('') }
function caseField(i,k,l,multi=false,img=false){const v=data.cases[i][k]||'';return `<div class="field"><label>${l}</label>${img?imageInput('cases',i,k,v):multi?`<textarea data-list="cases" data-index="${i}" data-key="${k}">${esc(v)}</textarea>`:`<input data-list="cases" data-index="${i}" data-key="${k}" value="${esc(v)}">`}</div>`}
function renderTeam(){ $('#teamList').innerHTML=data.team.map((m,i)=>`<div class="item"><div class="item-head"><strong>${esc(m.name||'새 전문가')}</strong><button class="btn btn-danger" onclick="removeTeam(${i})">삭제</button></div><div class="grid2">${teamField(i,'name','이름')}${teamField(i,'role','직함')}${teamField(i,'specialty','전문분야')}${teamField(i,'image','사진',false,true)}</div>${teamField(i,'bio','소개',true)}<div class="field"><label><input type="checkbox" data-list="team" data-index="${i}" data-key="is_public" ${m.is_public?'checked':''}> 홈페이지 공개</label></div></div>`).join('') }
function teamField(i,k,l,multi=false,img=false){const v=data.team[i][k]||'';return `<div class="field"><label>${l}</label>${img?imageInput('team',i,k,v):multi?`<textarea data-list="team" data-index="${i}" data-key="${k}">${esc(v)}</textarea>`:`<input data-list="team" data-index="${i}" data-key="${k}" value="${esc(v)}">`}</div>`}
function imageInput(list,i,k,v){return `<div class="image-row"><input data-list="${list}" data-index="${i}" data-key="${k}" value="${esc(v)}"><label class="btn btn-secondary" style="text-align:center">사진 선택<input hidden type="file" accept="image/*" onchange="uploadImage(event,'${list}',${i},'${k}')"></label></div>${v?`<img class="preview" src="${esc(v)}">`:''}<div class="small">3MB 이하 JPG·PNG·WEBP</div>`}
function renderFaq(){ $('#faqList').innerHTML=data.faq.map((f,i)=>`<div class="item"><div class="item-head"><strong>질문 ${i+1}</strong><button class="btn btn-danger" onclick="removeFaq(${i})">삭제</button></div><div class="field"><label>질문</label><input data-list="faq" data-index="${i}" data-key="question" value="${esc(f.question)}"></div><div class="field"><label>답변</label><textarea data-list="faq" data-index="${i}" data-key="answer">${esc(f.answer)}</textarea></div></div>`).join('') }
function sync(){document.querySelectorAll('[data-object]').forEach(el=>data[el.dataset.object][el.dataset.key]=el.value);document.querySelectorAll('[data-list]').forEach(el=>data[el.dataset.list][+el.dataset.index][el.dataset.key]=el.type==='checkbox'?el.checked:el.value)}
async function save(){sync();const r=await fetch('/.netlify/functions/content-save',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok){showStatus(j.error||'저장 실패',true);if(r.status===401)logout();return}showStatus('저장되었습니다. 홈페이지 새로고침 후 확인하세요.')}
async function uploadImage(e,list,i,key){const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024){showStatus('이미지는 3MB 이하만 가능합니다.',true);return}const base64=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=fail;r.readAsDataURL(f)});showStatus('이미지 업로드 중...');const r=await fetch('/.netlify/functions/media-upload',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify({filename:f.name,contentType:f.type,data:base64})});const j=await r.json();if(!r.ok){showStatus(j.error||'업로드 실패',true);return}data[list][i][key]=j.url;list==='cases'?renderCases():renderTeam();showStatus('이미지가 업로드되었습니다.')}
function addCase(){sync();data.cases.push({label:'가상·재구성 사례',title:'새 상담사례',category:'',situation:'',review:'',proposal:'',image:'/assets/consulting_photo.png'});renderCases()}function removeCase(i){if(confirm('이 사례를 삭제할까요?')){data.cases.splice(i,1);renderCases()}}function addTeam(){sync();data.team.push({name:'새 전문가',role:'',specialty:'',bio:'',image:'/assets/representative_photo.jpg',is_public:true});renderTeam()}function removeTeam(i){if(confirm('이 전문가를 삭제할까요?')){data.team.splice(i,1);renderTeam()}}function addFaq(){sync();data.faq.push({question:'새 질문',answer:'답변을 입력하세요.'});renderFaq()}function removeFaq(i){if(confirm('이 FAQ를 삭제할까요?')){data.faq.splice(i,1);renderFaq()}}function logout(){sessionStorage.removeItem('smbiz_admin_token');location.reload()}
$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#saveBtn').onclick=save;$('#logoutBtn').onclick=logout;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.panel).classList.add('active')});if(token)boot();
</script></body></html>
